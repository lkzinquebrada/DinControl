<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DinControl</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="conteudo-login">

        <img
            src="Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >
    <div class="login">

        <h1 class="T">
            Seja Bem Vindo(a) 
        </h1>

        <p class="SBT">
            Faça login para continuar
        </p>

        <form id="formLogin">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >

            <label for="senha">Senha</label>

            <div class="CampoSenha">
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
                <button type="button" 
                id="toggleSenha"
                class="botao-olho"
                >
                    <img src="Assets/olho.png" alt="Mostrar senha">
                    </button>
            </div>

            <button class="botao-entrar" type="submit">
                Entrar 
        
            </button>

            <p class="login-link">
                Não possui uma conta? <a href="/Cadastro/cadastro.html">Cadastre-se</a>
            </p>

        </form>

        <p id="mensagem"></p>

        <script src="login.js"></script>
    </div>  

    <img
    src="Assets/Coin.png"
    alt="Coin1"
    class="Coin"
>

</body>
</html>
