<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | DinControl</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
    <div class="conteudo-cadastro">

        <img
            src="Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >
    <div class="cadastro">

        <h1 class="titulo">
            Crie sua conta
        </h1>

        <p class="SubTitulo">
            Comece a controlar suas finanças
        </p>

        <form id="formCadastro">

            <label for="nome">Nome completo</label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu email"
                required
            >

            <label for="senha">Senha</label>

            <div class="CampoSenha">
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
                <button type="button" 
                id="toggleSenha"
                class="botao-olho"
                >
                    <img src="Assets/olho.png" alt="Mostrar senha">
                    </button>
            </div>

            <button type="submit">
                Criar conta
            </button>

            <p class="login-link">
                Já possui uma conta? <a href="/login/login.html">Faça login</a>
            </p>

        </form>

        <p id="mensagem"></p>

        <script src="cadastro.js"></script>
    </div>

    <img
    src="Assets/Coin.png"
    alt="Coin1"
    class="Coin"
>

</body>
</html>
