<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil - DinControl</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png">
    <link
        rel="stylesheet"
        href="perfil.css"
    >
</head>

<body>

    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <div class="pagina-perfil">

        <!-- =========================================
             LOGO
        ========================================== -->

        <img
            src="../Principal/Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >

        <!-- =========================================
             VOLTAR
        ========================================== -->

        <button
            type="button"
            class="botao-voltar"
            id="voltarDashboard"
            aria-label="Voltar para o dashboard"
        >
            ←
        </button>

        <!-- =========================================
             CARD PERFIL
        ========================================== -->

        <main class="card-perfil">

            <!-- TÍTULO -->
            <h1>Meu Perfil</h1>

            <div class="linha-titulo"></div>

            <!-- =====================================
                 FOTO
            ====================================== -->

            <div class="foto-perfil">

                <img
                    src="../Principal/Assets/perfil.png"
                    alt="Foto de perfil"
                    id="fotoPerfil"
                >

                <label
                    for="inputFoto"
                    class="botao-foto"
                >
                    Escolher foto
                </label>

                <input
                    type="file"
                    id="inputFoto"
                    accept="image/png, image/jpeg, image/webp"
                    hidden
                >

            </div>

            <!-- =====================================
                 FORMULÁRIO
            ====================================== -->

            <form id="formPerfil">

                <!-- NOME -->
                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    autocomplete="name"
                    required
                >

                <!-- EMAIL -->
                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                    required
                >

                <!-- SENHA -->
                <label for="senha">
                    Senha necessária para alteração
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="new-password"
                >

                <!-- SALVAR -->
                <button
                    type="submit"
                    class="botao-salvar"
                >
                    SALVAR ALTERAÇÕES
                </button>

            </form>

            <!-- =====================================
                 MENSAGEM
            ====================================== -->

            <p id="mensagemPerfil"></p>

            <!-- =====================================
                 SAIR
            ====================================== -->

            <button
                type="button"
                class="botao-sair"
                id="sairConta"
            >
                SAIR DA CONTA
            </button>

        </main>

        <!-- =========================================
             COIN
        ========================================== -->

        <img
            src="../Principal/Assets/Coin.png"
            alt="Mascote DinControl"
            class="Coin"
        >

    </div>

    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="perfil.js"></script>

</body>

</html>
