<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Esqueci minha senha | DinControl</title>
    <link rel="stylesheet" href="redefinir.css">
    
<link
    rel="icon"
    type="image/png"
    href="Assets/favicon.png"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="Assets/apple-touch-icon.png"
>

<meta
    name="apple-mobile-web-app-title"
    content="DinControl"
>

<meta
    name="theme-color"
    content="#001b3d"
>

</head>

<body>

    <div class="conteudo-redefinir">

        <!-- LOGO -->
        <img
            src="Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >

        <!-- CAIXA REDEFINIR -->
        <div class="redefinir">

            <h1 class="titulo">
                Redefina sua senha
            </h1>

            <form id="formRedef">

                <!-- EMAIL -->
                <label for="email">
                    Você receberá um código neste e-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

                <button
                    type="button"
                    id="btnEnviarCodigo"
                >
                    Enviar Código
                </button>

                <!-- CÓDIGO -->
                <div class="CampoC">

                    <label for="codigo">
                        Digite o código recebido no e-mail
                    </label>

                    <input
                        type="text"
                        id="codigo"
                        placeholder="Digite o código"
                        maxlength="6"
                        inputmode="numeric"
                    >

                    <button
                        type="button"
                        id="btnVerificarCodigo"
                    >
                        Verificar código
                    </button>

                </div>

                <!-- MENSAGEM -->
                <p id="mensagem"></p>

            </form>

        </div>

        <!-- MASCOTE -->
        <img
            src="Assets/Coin.png"
            alt="Coin"
            class="Coin"
        >

    </div>

    <script src="redefinir.js"></script>

</body>

</html>
