<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Histórico | DinControl</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png">
    <link
        rel="stylesheet"
        href="historico.css"
    >
</head>

<body>

    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <div class="pagina-historico">

        <!-- =========================================
             LOGO
        ========================================== -->

        <img
            src="../Principal/Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >

        <!-- =========================================
             PERFIL
        ========================================== -->

        <div class="area-perfil">

            <span
                id="nomeUsuario"
                class="nome-usuario"
            >
                Usuário
            </span>

            <button
                type="button"
                class="botao-perfil"
                id="botaoPerfil"
            >
                <img
                    src="../Principal/Assets/perfil.png"
                    alt="Perfil"
                    id="fotoPerfilHistorico"
                >
            </button>

        </div>

        <!-- =========================================
             MENU
        ========================================== -->

        <div class="area-menu">

            <button
                type="button"
                class="botao-menu"
                id="botaoMenu"
            >
                ☰
            </button>

            <div
                class="menu-paginas"
                id="menuPaginas"
            >
                <a href="/Principal/principal.html">
                    Início
                </a>

                <a
                    href="/Historico/historico.html"
                    class="pagina-ativa"
                >
                    Histórico
                </a>
            </div>

        </div>

        <!-- =========================================
             CARD HISTÓRICO
        ========================================== -->

        <main class="card-historico">

            <!-- =====================================
                 CABEÇALHO
            ====================================== -->

            <div class="cabecalho-historico">

                <h1>HISTÓRICO</h1>

                <div class="filtros">

                    <!-- TIPO -->
                    <select id="filtroTipo">
                        <option value="todos">Tipo</option>
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>

                    <!-- MÊS -->
                    <select id="filtroMes">
                        <option value="todos">Todos os meses</option>
                        <option value="0">Janeiro</option>
                        <option value="1">Fevereiro</option>
                        <option value="2">Março</option>
                        <option value="3">Abril</option>
                        <option value="4">Maio</option>
                        <option value="5">Junho</option>
                        <option value="6">Julho</option>
                        <option value="7">Agosto</option>
                        <option value="8">Setembro</option>
                        <option value="9">Outubro</option>
                        <option value="10">Novembro</option>
                        <option value="11">Dezembro</option>
                    </select>

                    <!-- CATEGORIA -->
                    <select id="filtroCategoria">
                        <option value="todos">Categoria</option>
                    </select>

                </div>

            </div>

            <!-- =====================================
                 RESUMO
            ====================================== -->

            <div class="resumo-historico">

                <div class="resumo-box">
                    <span class="resumo-titulo">
                        Entrada
                    </span>

                    <strong
                        class="valor-entrada"
                        id="resumoEntrada"
                    >
                        R$ 0,00
                    </strong>
                </div>

                <div class="resumo-box">
                    <span class="resumo-titulo">
                        Saída
                    </span>

                    <strong
                        class="valor-saida"
                        id="resumoSaida"
                    >
                        R$ 0,00
                    </strong>
                </div>

                <div class="resumo-box">
                    <span class="resumo-titulo">
                        Saldo
                    </span>

                    <strong
                        class="valor-saldo"
                        id="resumoSaldo"
                    >
                        R$ 0,00
                    </strong>
                </div>

            </div>

            <!-- =====================================
                 CABEÇALHO DA TABELA
            ====================================== -->

            <div class="cabecalho-tabela">
                <span>Valor</span>
                <span>Tipo</span>
                <span>Categoria</span>
                <span>Horário</span>
            </div>

            <!-- =====================================
                 TRANSAÇÕES
            ====================================== -->

            <div
                class="lista-transacoes"
                id="listaTransacoes"
            >
                <!-- GERADO PELO JS -->
            </div>

            <!-- =====================================
                 SEM TRANSAÇÕES
            ====================================== -->

            <div
                class="sem-transacoes"
                id="semTransacoes"
            >
                Nenhuma transação encontrada.
            </div>

        </main>

    </div>

    <img
        src="Assets/Coin.png"
        alt="Coin"
        class="Coin"
    >

    <script src="historico.js"></script>

</body>

</html>
