<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | DinControl</title>
    <link rel="stylesheet" href="principal.css">

<link
    rel="icon"
    type="image/png"
    href="Assets/favicon.png"
>

<link
    rel="apple-touch-icon"
    sizes="180x180"
    href="Assets/apple-touch-icon.png"
>

<meta
    name="apple-mobile-web-app-title"
    content="DinControl"
>

<meta
    name="theme-color"
    content="#001b3d"
>

</head>

<body>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <div class="conteudo-principal">

        <!-- Topo -->
        <header class="topo-dashboard">

            <img
                src="Assets/Logo.png"
                alt="DinControl"
                class="logo-dincontrol"
            >

            <div class="acoes-topo">

                <!-- Menu de páginas -->
                <div class="area-menu">
                    <button
                        type="button"
                        class="botao-menu"
                        id="botaoMenu"
                    >
                        ☰
                    </button>

                    <div
                        class="menu-paginas"
                        id="menuPaginas"
                    >
                        <a
                            href="/Principal/principal.html"
                            class="item-menu"
                        >
                            Início
                        </a>

                        <a
                            href="/Historico/historico.html"
                            class="item-menu"
                        >
                            Histórico
                        </a>
                    </div>
                </div>

                <!-- Saldo e nova transação -->
                <div class="area-saldo">
                    <button
                        class="botao-adicionar"
                        id="abrirTransacao"
                        type="button"
                    >
                        +
                    </button>

                    <div
                        class="painel-transacao"
                        id="painelTransacao"
                    >
                        <p class="titulo-transacao">
                            Nova Transação
                        </p>

                        <!-- Entrada -->
                        <div class="linha-transacao entrada">
                            <span class="bolinha entrada-cor"></span>

                            <span class="cifrao">
                                R$:
                            </span>

                            <input
                                type="number"
                                id="valorEntrada"
                                step="0.01"
                                min="0"
                                placeholder="0,00"
                            >

                            <select id="categoriaEntrada">
                                <option value=""></option>
                                <option value="Salario">Salário</option>
                                <option value="Outros">Outros</option>
                                <option value="Personalizada">Categoria personalizada</option>
                            </select>
                        </div>

                        <input
                            type="text"
                            id="categoriaEntradaPersonalizada"
                            class="campo-categoria-personalizada"
                            placeholder="Digite a categoria"
                            maxlength="30"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            hidden
                        >

                        <!-- Saída -->
                        <div class="linha-transacao">
                            <span class="bolinha saida-cor"></span>

                            <span class="cifrao">
                                R$:
                            </span>

                            <input
                                type="number"
                                id="valorSaida"
                                step="0.01"
                                min="0"
                                placeholder="0,00"
                            >

                            <div class="area-seta">
                                <select id="categoriaSaida">
                                    <option value=""></option>
                                    <option value="Alimentacao">Alimentação</option>
                                    <option value="Locomocao">Locomoção</option>
                                    <option value="Lazer">Lazer</option>
                                    <option value="Educacao">Educação</option>
                                    <option value="Investimento">Investimento</option>
                                    <option value="Outros">Outros</option>
                                    <option value="Personalizada">Categoria personalizada</option>
                                </select>
                            </div>
                        </div>

                        <input
                            type="text"
                            id="categoriaSaidaPersonalizada"
                            class="campo-categoria-personalizada"
                            placeholder="Digite a categoria"
                            maxlength="30"
                            autocomplete="off"
                            autocorrect="off"
                            autocapitalize="off"
                            spellcheck="false"
                            hidden
                        >

                        <button
                            id="confirmarTransacao"
                            class="confirmar-transacao"
                            type="button"
                        >
                            CONFIRMAR
                        </button>

                        <p id="mensagemTransacao"></p>
                    </div>

                    <div class="saldo-box">
                        <div class="saldo-titulo">
                            Saldo Atual
                        </div>

                        <div
                            class="saldo-valor"
                            id="valorSaldo"
                        >
                            R$ 0,00
                        </div>
                    </div>
                </div>

                <!-- Perfil -->
                <div class="area-perfil">
                    <span
                        id="nomeUsuario"
                        class="nome-usuario"
                    >
                        Usuário
                    </span>

                    <button
                        class="botao-perfil"
                        type="button"
                    >
                        <img
                            src="Assets/perfil.png"
                            alt="Perfil"
                            class="perfil"
                            id="fotoPerfilDashboard"
                        >
                    </button>
                </div>

            </div>
        </header>

        <!-- Dashboard -->
        <main class="dashboard-grid">

            <section class="card-entrada-saida">
                <div class="cabecalho-entrada-saida">
                    <h2>ENTRADA/SAÍDA</h2>
                    <span
                        class="indicador-verde"
                        id="indicadorSaldo"
                    ></span>
                </div>

                <div class="linha-card"></div>

                <div class="resumo-item">
                    <strong>Entrada:</strong>
                    <span id="totalEntrada">R$ 0,00</span>
                </div>

                <div class="resumo-item">
                    <strong>Saída:</strong>
                    <span id="totalSaida">R$ 0,00</span>
                </div>

                <div class="resumo-item">
                    <strong>Investimento:</strong>
                    <span id="totalInvestimento">R$ 0,00</span>
                </div>
            </section>

            <section class="card-grafico-mensal">
                <h2>GRÁFICO MENSAL</h2>
                <div class="linha-titulo"></div>

                <div class="grafico-mensal-container">
                    <canvas id="graficoMensal"></canvas>
                </div>
            </section>

            <section class="card-grafico-saida">
                <h2>GRÁFICO DE SAÍDA</h2>
                <div class="linha-grafico-saida"></div>

                <div class="grafico-saida-container">
                    <canvas id="graficoSaida"></canvas>
                </div>
            </section>

            <section class="card-grafico-investimento">
                <h2>INVESTIMENTO</h2>
                <div class="linha-grafico-investimento"></div>

                <div class="grafico-investimento-container">
                    <canvas id="graficoInvestimento"></canvas>
                </div>
            </section>

        </main>

        <img
            src="Assets/Coin.png"
            alt="Mascote DinControl"
            class="Coin"
        >

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="principal.js"></script>

</body>

</html>
