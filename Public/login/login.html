<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DinControl</title>

    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="Assets/favicon.png">
</head>

<body>

    <div id="loading-screen">
        <div class="loader"></div>
    </div>

    <div class="conteudo-login">

        <img
            src="Assets/Logo.png"
            alt="DinControl"
            class="logo-dincontrol"
        >

        <div class="login">

            <h1 class="T">
                Seja Bem Vindo(a)
            </h1>

            <p class="SBT">
                Faça login para continuar
            </p>

            <form id="formLogin">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu email"
                    required
                >

                <div class="linha-senha">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="Esqueci">
                        <a href="/Redefinir/redefinir.html">
                            Esqueceu sua senha?
                        </a>
                    </div>

                </div>

                <div class="CampoSenha">

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                    >

                    <button
                        type="button"
                        class="botao-olho"
                    >
                        <img src="Assets/olho.png">
                    </button>

                </div>

                <button
                    class="botao-entrar"
                    type="submit"
                >
                    Entrar
                </button>

                <p class="login-link">
                    Não possui uma conta?
                    <a href="/Cadastro/cadastro.html">
                        Cadastre-se
                    </a>
                </p>

            </form>

            <p id="mensagem"></p>

        </div>

    </div>

    <img
        src="Assets/Coin.png"
        alt="Coin1"
        class="Coin"
    >

    <script src="login.js"></script>

</body>

</html>
